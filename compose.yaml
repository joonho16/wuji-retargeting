name: wuji-retargeting

x-wuji-base: &wuji-base
  build:
    context: .
    dockerfile: Dockerfile
    args:
      MANUS_BUILD_GRPC: ${MANUS_BUILD_GRPC:-1}
      MANUS_GRPC_RELEASE_TAG: ${MANUS_GRPC_RELEASE_TAG:-v1.28.1}
  image: wuji-retargeting:realsense-wh110
  working_dir: /workspace/wuji-retargeting
  init: true
  environment:
    PYTHONUNBUFFERED: "1"
    MUJOCO_GL: ${MUJOCO_GL:-glfw}
    DISPLAY: ${DISPLAY:-}
    QT_X11_NO_MITSHM: "1"
    # Prefer software Mesa in Docker so host nouveau/NVIDIA GLX mismatches do not
    # kill MuJoCo/OpenCV windows. Override to 0 if you intentionally configure GPU GL.
    LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
    MESA_LOADER_DRIVER_OVERRIDE: ${MESA_LOADER_DRIVER_OVERRIDE:-llvmpipe}
    LIBGL_DRI3_DISABLE: ${LIBGL_DRI3_DISABLE:-1}
    HAND: ${HAND:-right}
    MANUS_SDK_ROOT: ${MANUS_SDK_ROOT:-/opt/manus/ManusSDK_v3.1.1}
    LD_LIBRARY_PATH: /opt/manus/ManusSDK_v3.1.1/SDKMinimalClient_Linux/ManusSDK/lib:/opt/manus/ManusSDK_v3.1.1/SDKClient_Linux/ManusSDK/lib:/opt/manus/ManusSDK_v3.1.1/ROS2/ManusSDK/lib

x-manus-sdk-volume: &manus-sdk-volume ${MANUS_SDK_HOST_DIR:-./manus-sdk/ManusSDK_v3.1.1}:${MANUS_SDK_ROOT:-/opt/manus/ManusSDK_v3.1.1}:${MANUS_SDK_VOLUME_MODE:-rw}
x-manus-dev-volume: &manus-dev-volume /dev:/dev
x-manus-udev-volume: &manus-udev-volume /run/udev:/run/udev:ro

x-gui-env: &gui-env
  DISPLAY: ${DISPLAY:-}
  QT_X11_NO_MITSHM: "1"
  MUJOCO_GL: ${MUJOCO_GL:-glfw}
  LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
  MESA_LOADER_DRIVER_OVERRIDE: ${MESA_LOADER_DRIVER_OVERRIDE:-llvmpipe}
  LIBGL_DRI3_DISABLE: ${LIBGL_DRI3_DISABLE:-1}

x-realsense-access: &realsense-access
  device_cgroup_rules:
    # RealSense USB/UVC character devices. Mirrors librealsense Docker guidance.
    - "c 81:* rmw"
    - "c 189:* rmw"

x-manus-ports: &manus-ports
  # Loopback by default so unauthenticated UDP keypoints are not LAN-reachable.
  # Set MANUS_PUBLISH_HOST=0.0.0.0 only on a controlled/trusted network.
  - "${MANUS_PUBLISH_HOST:-127.0.0.1}:${MANUS_PORT:-15020}:${MANUS_PORT:-15020}/udp"

services:
  # Safe default: docker compose up / run smoke only imports dependencies and
  # checks bundled model assets. It does not mount /dev and cannot energize WH110.
  smoke:
    <<: *wuji-base
    command: ["python", "scripts/docker_smoke.py"]

  # Non-motion RealSense check. Fails clearly when no camera is attached.
  realsense-check:
    <<: [*wuji-base, *realsense-access]
    profiles: ["realsense"]
    volumes:
      - /dev:/dev
    command:
      - bash
      - -lc
      - |
        python - <<'PY'
        import pyrealsense2 as rs

        ctx = rs.context()
        devices = list(ctx.query_devices())
        print(f"RealSense devices found: {len(devices)}")
        for idx, dev in enumerate(devices):
            name = dev.get_info(rs.camera_info.name)
            serial = dev.get_info(rs.camera_info.serial_number)
            firmware = dev.get_info(rs.camera_info.firmware_version)
            print(f"[{idx}] {name} serial={serial} firmware={firmware}")
        raise SystemExit(0 if devices else 2)
        PY

  # RealSense + MuJoCo/OpenCV GUI simulation. No real hand is enabled here.
  teleop-sim-realsense:
    <<: [*wuji-base, *realsense-access]
    profiles: ["realsense", "gui"]
    environment:
      <<: *gui-env
      PYTHONUNBUFFERED: "1"
      HAND: ${HAND:-right}
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Use the host-side tuned YAML without rebuilding the image.
      - ./example/config:/workspace/wuji-retargeting/example/config:ro
    command:
      - bash
      - -lc
      - cd example && python teleop_sim.py --realsense --show-video --hand "$${HAND:-right}"

  # RealSense tuning GUI. No real hand is enabled here.
  tuning-realsense:
    <<: [*wuji-base, *realsense-access]
    profiles: ["realsense", "gui"]
    environment:
      <<: *gui-env
      PYTHONUNBUFFERED: "1"
      HAND: ${HAND:-right}
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Keep tuning_tool.py auto-reload useful from the host editor.
      - ./example/config:/workspace/wuji-retargeting/example/config:rw
    command:
      - bash
      - -lc
      - cd example && python tuning_tool.py --realsense --show-video --hand "$${HAND:-right}"

  # Real hardware profile: opt-in only. This path can enable and move WH110.
  real-wh110:
    <<: [*wuji-base, *realsense-access]
    profiles: ["real-wh110"]
    environment:
      <<: *gui-env
      PYTHONUNBUFFERED: "1"
      HAND: ${HAND:-right}
      HAND_SERIAL: ${HAND_SERIAL:-}
      SHOW_VIDEO: ${SHOW_VIDEO:-1}
      CONFIRM_REAL_WH110: ${CONFIRM_REAL_WH110:-}
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # wujihandpy reads per-device Wuji Studio assets from $HOME/.wuji.
      - ${HOME}/.wuji:/root/.wuji:ro
      # Use the same staged/tuned config files as simulation.
      - ./example/config:/workspace/wuji-retargeting/example/config:ro
    device_cgroup_rules:
      # RealSense USB/UVC.
      - "c 81:* rmw"
      - "c 189:* rmw"
      # WH110 USB-CDC serial devices: ttyACM and ttyUSB.
      - "c 166:* rmw"
      - "c 188:* rmw"
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        if [ "$${CONFIRM_REAL_WH110:-}" != "I_UNDERSTAND_WH110_MOVES" ]; then
          cat >&2 <<'MSG'
        Refusing to start real WH110 teleop.
        This service can enable and move the physical hand.
        Re-run only after staged smoke, RealSense, simulation, and tuning checks:
          CONFIRM_REAL_WH110=I_UNDERSTAND_WH110_MOVES docker compose --profile real-wh110 run --rm real-wh110
        MSG
          exit 64
        fi
        if [ ! -d /root/.wuji ]; then
          echo "Missing /root/.wuji. Mount the host Wuji Studio assets with HOME set or edit compose.yaml." >&2
          exit 65
        fi
        extra=()
        if [ -n "$${HAND_SERIAL:-}" ]; then
          extra+=(--hand-serial "$${HAND_SERIAL}")
        fi
        if [ "$${SHOW_VIDEO:-1}" != "0" ]; then
          extra+=(--show-video)
        fi
        cd example
        exec python teleop_real.py --realsense --hand "$${HAND:-right}" --hand-model wh110 "$${extra[@]}"
  # MANUS SDK shell with official Linux SDK dependencies installed. Use this to
  # build/run MANUS SDK examples against the mounted SDK directory. Host network
  # lets Core Remote discovery work; privileged + /dev + /run/udev enables
  # Integrated/USB glove access as recommended by MANUS docs.
  manus-sdk-shell:
    <<: *wuji-base
    profiles: ["manus-sdk"]
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - *manus-sdk-volume
      - *manus-dev-volume
      - *manus-udev-volume
    working_dir: ${MANUS_SDK_ROOT:-/opt/manus/ManusSDK_v3.1.1}
    command: ["bash"]

  # Build and run the MANUS SDK Minimal Client from the mounted SDK. It is
  # interactive: choose [1] Integrated, [2] local Core, or [3] remote Core.
  manus-sdk-minimal-client:
    <<: *wuji-base
    profiles: ["manus-sdk"]
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - *manus-sdk-volume
      - *manus-dev-volume
      - *manus-udev-volume
    working_dir: ${MANUS_SDK_ROOT:-/opt/manus/ManusSDK_v3.1.1}/SDKMinimalClient_Linux
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        test -f Makefile || {
          echo "MANUS SDK minimal-client Makefile not found in $${PWD}" >&2
          echo "Check MANUS_SDK_HOST_DIR; default is ./manus-sdk/ManusSDK_v3.1.1 on the Docker daemon host." >&2
          ls -la >&2
          exit 2
        }
        make all
        exec ./SDKMinimalClient.out

  # Same SDK client, but temporarily rewrites MANUS' limited broadcast discovery
  # (255.255.255.255:62687/udp) to unicast at MANUS_CORE_IP:62687. This is a
  # diagnostic/workaround for LANs that route unicast between the two hosts but
  # drop limited broadcast before MANUS Core sees it.
  manus-sdk-minimal-client-unicast:
    <<: *wuji-base
    profiles: ["manus-sdk"]
    network_mode: host
    privileged: true
    environment:
      MANUS_CORE_IP: ${MANUS_CORE_IP:-}
    stdin_open: true
    tty: true
    volumes:
      - *manus-sdk-volume
      - *manus-dev-volume
      - *manus-udev-volume
    working_dir: ${MANUS_SDK_ROOT:-/opt/manus/ManusSDK_v3.1.1}/SDKMinimalClient_Linux
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        : "$${MANUS_CORE_IP:?Set MANUS_CORE_IP to the Windows MANUS Core IP}"
        test -f Makefile || {
          echo "MANUS SDK minimal-client Makefile not found in $${PWD}" >&2
          echo "Check MANUS_SDK_HOST_DIR; default is ./manus-sdk/ManusSDK_v3.1.1 on the Docker daemon host." >&2
          ls -la >&2
          exit 2
        }
        if ! command -v iptables >/dev/null 2>&1; then
          apt-get update >/dev/null
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends iptables >/dev/null
        fi
        cleanup() {
          iptables -t nat -D OUTPUT -p udp -d 255.255.255.255 --dport 62687 \
            -j DNAT --to-destination "$${MANUS_CORE_IP}:62687" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        cleanup
        iptables -t nat -I OUTPUT 1 -p udp -d 255.255.255.255 --dport 62687 \
          -j DNAT --to-destination "$${MANUS_CORE_IP}:62687"
        echo "MANUS SDK discovery DNAT active: 255.255.255.255:62687/udp -> $${MANUS_CORE_IP}:62687/udp"
        make all
        exec ./SDKMinimalClient.out

  # Real MANUS Core -> Wuji UDP bridge. It connects to MANUS Core using the
  # same unicast discovery workaround, then builds/runs the tracked bridge source
  # in tools/manus_bridge and publishes MediaPipe-order 21x3 JSON keypoints to
  # MANUS_UDP_HOST:MANUS_UDP_PORT for tuning/teleop services. The proprietary
  # SDK stays mounted at runtime and is not committed.
  manus-sdk-udp-bridge-unicast:
    <<: *wuji-base
    profiles: ["manus-sdk"]
    network_mode: host
    privileged: true
    environment:
      MANUS_CORE_IP: ${MANUS_CORE_IP:-}
    stdin_open: true
    tty: true
    volumes:
      - *manus-sdk-volume
      - *manus-dev-volume
      - *manus-udev-volume
    working_dir: /workspace/wuji-retargeting
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        : "$${MANUS_CORE_IP:?Set MANUS_CORE_IP to the Windows MANUS Core IP}"
        export MANUS_CONNECTION='${MANUS_CONNECTION:-remote}'
        export MANUS_UDP_HOST='${MANUS_UDP_HOST:-127.0.0.1}'
        export MANUS_UDP_PORT='${MANUS_UDP_PORT:-15020}'
        export MANUS_UDP_HAND='${MANUS_UDP_HAND:-${HAND:-left}}'
        test -f tools/manus_bridge/manus_wuji_udp_bridge.cpp || {
          echo "Tracked MANUS bridge source is missing from the repo image." >&2
          exit 2
        }
        if ! command -v iptables >/dev/null 2>&1; then
          apt-get update >/dev/null
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends iptables >/dev/null
        fi
        cleanup() {
          iptables -t nat -D OUTPUT -p udp -d 255.255.255.255 --dport 62687 \
            -j DNAT --to-destination "$${MANUS_CORE_IP}:62687" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        cleanup
        iptables -t nat -I OUTPUT 1 -p udp -d 255.255.255.255 --dport 62687 \
          -j DNAT --to-destination "$${MANUS_CORE_IP}:62687"
        echo "MANUS SDK discovery DNAT active: 255.255.255.255:62687/udp -> $${MANUS_CORE_IP}:62687/udp"
        echo "MANUS UDP bridge target: $${MANUS_UDP_HOST}:$${MANUS_UDP_PORT} hand=$${MANUS_UDP_HAND}"
        tools/manus_bridge/build_manus_wuji_udp_bridge.sh /tmp/manus_wuji_udp_bridge
        exec /tmp/manus_wuji_udp_bridge

  # No-motion MANUS UDP port check. Start with `docker compose run --service-ports`
  # (or `docker compose up`) so host UDP packets can reach the container.
  manus-check:
    <<: *wuji-base
    profiles: ["manus"]
    environment:
      PYTHONUNBUFFERED: "1"
      HAND: ${HAND:-left}
      MANUS_HOST: ${MANUS_HOST:-0.0.0.0}
      MANUS_PORT: ${MANUS_PORT:-15020}
      MANUS_UNIT: ${MANUS_UNIT:-m}
      MANUS_TIMEOUT: ${MANUS_TIMEOUT:-0.5}
      MANUS_CHECK_MAX_WAIT: ${MANUS_CHECK_MAX_WAIT:-15}
    ports: *manus-ports
    command:
      - bash
      - -lc
      - >-
        cd example && python input_devices/manus_quantum.py
        --host "$${MANUS_HOST:-0.0.0.0}"
        --port "$${MANUS_PORT:-15020}"
        --hand "$${HAND:-left}"
        --unit "$${MANUS_UNIT:-m}"
        --timeout "$${MANUS_TIMEOUT:-0.5}"
        --once
        --max-wait "$${MANUS_CHECK_MAX_WAIT:-15}"

  # MANUS bridge + MuJoCo GUI simulation. No real hand is enabled here.
  teleop-sim-manus:
    <<: *wuji-base
    profiles: ["manus", "gui"]
    environment:
      <<: *gui-env
      PYTHONUNBUFFERED: "1"
      HAND: ${HAND:-left}
      MANUS_HOST: ${MANUS_HOST:-0.0.0.0}
      MANUS_PORT: ${MANUS_PORT:-15020}
      MANUS_UNIT: ${MANUS_UNIT:-m}
      MANUS_TIMEOUT: ${MANUS_TIMEOUT:-0.5}
    ports: *manus-ports
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./example/config:/workspace/wuji-retargeting/example/config:ro
    command:
      - bash
      - -lc
      - >-
        cd example && python teleop_sim.py --input manus
        --hand "$${HAND:-left}"
        --manus-host "$${MANUS_HOST:-0.0.0.0}"
        --manus-port "$${MANUS_PORT:-15020}"
        --manus-unit "$${MANUS_UNIT:-m}"
        --manus-timeout "$${MANUS_TIMEOUT:-0.5}"

  # MANUS bridge tuning GUI. No real hand is enabled here.
  tuning-manus:
    <<: *wuji-base
    profiles: ["manus", "gui"]
    environment:
      <<: *gui-env
      PYTHONUNBUFFERED: "1"
      HAND: ${HAND:-left}
      MANUS_HOST: ${MANUS_HOST:-0.0.0.0}
      MANUS_PORT: ${MANUS_PORT:-15020}
      MANUS_UNIT: ${MANUS_UNIT:-m}
      MANUS_TIMEOUT: ${MANUS_TIMEOUT:-0.5}
    ports: *manus-ports
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./example/config:/workspace/wuji-retargeting/example/config:rw
    command:
      - bash
      - -lc
      - >-
        cd example && python tuning_tool.py --manus
        --hand "$${HAND:-left}"
        --manus-host "$${MANUS_HOST:-0.0.0.0}"
        --manus-port "$${MANUS_PORT:-15020}"
        --manus-unit "$${MANUS_UNIT:-m}"
        --manus-timeout "$${MANUS_TIMEOUT:-0.5}"

  # Real hardware profile: opt-in only. This path can enable and move WH110 from MANUS input.
  real-wh110-manus:
    <<: *wuji-base
    profiles: ["real-wh110", "manus"]
    privileged: true
    environment:
      PYTHONUNBUFFERED: "1"
      HAND: ${HAND:-left}
      HAND_SERIAL: ${HAND_SERIAL:-}
      CONFIRM_REAL_WH110: ${CONFIRM_REAL_WH110:-}
      MANUS_HOST: ${MANUS_HOST:-0.0.0.0}
      MANUS_PORT: ${MANUS_PORT:-15020}
      MANUS_UNIT: ${MANUS_UNIT:-m}
      MANUS_TIMEOUT: ${MANUS_TIMEOUT:-0.5}
    ports: *manus-ports
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ${HOME}/.wuji:/root/.wuji:ro
      - ./example/config:/workspace/wuji-retargeting/example/config:ro
    device_cgroup_rules:
      # WH110 USB-CDC serial devices: ttyACM and ttyUSB.
      - "c 166:* rmw"
      - "c 188:* rmw"
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        if [ "$${CONFIRM_REAL_WH110:-}" != "I_UNDERSTAND_WH110_MOVES" ]; then
          cat >&2 <<'MSG'
        Refusing to start real WH110 MANUS teleop.
        This service can enable and move the physical hand.
        Re-run only after staged smoke, MANUS UDP, simulation, and tuning checks:
          CONFIRM_REAL_WH110=I_UNDERSTAND_WH110_MOVES docker compose --profile real-wh110 --profile manus run --rm --service-ports real-wh110-manus
        MSG
          exit 64
        fi
        if [ ! -d /root/.wuji ]; then
          echo "Missing /root/.wuji. Mount the host Wuji Studio assets with HOME set or edit compose.yaml." >&2
          exit 65
        fi
        extra=()
        if [ -n "$${HAND_SERIAL:-}" ]; then
          extra+=(--hand-serial "$${HAND_SERIAL}")
        fi
        cd example
        exec python teleop_real.py --input manus --hand "$${HAND:-left}" --hand-model wh110 \
          --manus-host "$${MANUS_HOST:-0.0.0.0}" \
          --manus-port "$${MANUS_PORT:-15020}" \
          --manus-unit "$${MANUS_UNIT:-m}" \
          --manus-timeout "$${MANUS_TIMEOUT:-0.5}" \
          "$${extra[@]}"
