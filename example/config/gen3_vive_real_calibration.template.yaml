# Gen3 VIVE real-robot calibration template.
# Copy this file to .local/gen3_vive_calib/real_gen3_vive_calibration.yaml,
# measure/edit every transform and limit, then change the review flag to true.
# The real-robot compose wrapper refuses to run while this is false/missing.
real_robot_calibration_reviewed: false

source_frame: steamvr_world
planning_frame: base_link
tracker_role: gen3_tracker
tracker_mount_frame: gen3_tool_tracker

# Transform from SteamVR/source coordinates into the Gen3 planning frame.
# Replace identity with the measured calibration before real robot use.
T_planning_source:
  translation: [0.0, 0.0, 0.0]
  rotation_xyzw: [0.0, 0.0, 0.0, 1.0]

# Native path: ^tool T_control for the robot hand's virtual tracker/control point.
# translation: actual TCP -> desired control point, in TCP axes, in METRES.
# rotation_xyzw: control-frame orientation expressed in the actual TCP frame.
# T_base_control = T_base_tool * T_tool_tracker_mount. Zero offset uses the TCP.
# The physical human tracker position is mapped to this robot control point.
T_tool_tracker_mount:
  translation: [0.0, 0.0, 0.0]
  rotation_xyzw: [0.0, 0.0, 0.0, 1.0]

linear_scale: 1.0
angular_scale: 1.0
# Per-axis tracker-driven control-point limits, relative to its neutral pose
# captured when deadman changes false -> true.
# Optional: omit workspace_limits or set it to null to disable offset clamping.
workspace_limits:
  x: [-0.25, 0.25]
  y: [-0.25, 0.25]
  z: [-0.20, 0.20]
max_linear_mps: 0.10
max_angular_radps: 0.25
# Optional jitter deadbands before speed limiting/filtering.  Start small:
# ~3 mm linear and ~0.02 rad angular suppress stationary VIVE/TF buzz without
# changing larger hand motions.
linear_deadband_m: 0.003
angular_deadband_rad: 0.02
stale_timeout_s: 0.10
