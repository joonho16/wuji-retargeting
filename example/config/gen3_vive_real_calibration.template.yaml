# Gen3 + left WH110 calibration defaults from the current reviewed setup.
# init-calib copies these settings to .local/gen3_vive_calib without overwriting
# an existing file. The review flag applies to this saved physical setup.
real_robot_calibration_reviewed: true

source_frame: steamvr_world
planning_frame: base_link
tracker_role: gen3_tracker
tracker_mount_frame: gen3_tool_tracker

# Transform from SteamVR/source coordinates into the Gen3 planning frame.
# User-selected 90-degree axis alignment: Gen3 (X, Y, Z) = VIVE (-Z, -X, +Y).
# R_planning_source = [[0, 0, -1], [-1, 0, 0], [0, 1, 0]].
# Absolute translation was not estimated; relative mapping uses rotation.
T_planning_source:
  translation: [0.0, 0.0, 0.0]
  rotation_xyzw: [0.5, -0.5, -0.5, 0.5]

# Native path: ^tool T_control for the robot hand's virtual tracker/control point.
# translation: end_effector_link -> desired hand-back point, in TCP axes, METRES.
# rotation_xyzw: control-frame orientation expressed in the actual TCP frame.
# T_base_control = T_base_tool * T_tool_tracker_mount.
# User-measured hand-back offset: X=0 mm, Y=-70 mm, Z=+120 mm.
T_tool_tracker_mount:
  translation: [0.0, -0.070, 0.120]
  rotation_xyzw: [0.0, 0.0, 0.0, 1.0]

linear_scale: 1.0
angular_scale: 1.0
# workspace_limits omitted: no tracker-driven target offset box.
max_linear_mps: 0.5
max_angular_radps: 1.7453292519943295  # 100 deg/s
# Optional jitter deadbands before speed limiting/filtering.  Start small:
# ~3 mm linear and ~0.02 rad angular suppress stationary VIVE/TF buzz without
# changing larger hand motions.
linear_deadband_m: 0.003
angular_deadband_rad: 0.02
stale_timeout_s: 0.10
